# -- general -------------------------------------------------------------------

# Improve colors
set -g default-terminal "screen-256color"

# Enable mouse mode
set -g mouse on

# Set scrollback buffer to 10000 lines
set -g history-limit 10000

# Customize the status line
setw -g monitor-activity on
setw -g visual-activity on

# -- navigation ----------------------------------------------------------------

# create session
bind C-c new-session

# find session
bind C-f command-prompt -p find-session 'switch-client -t %%'

# session navigation
bind BTab switch-client -l  # move to last session

# split current window horizontally
bind - split-window -v
# split current window vertically
bind _ split-window -h

# pane navigation
bind -r h select-pane -L  # move left
bind -r j select-pane -D  # move down
bind -r k select-pane -U  # move up
bind -r l select-pane -R  # move right
bind > swap-pane -D       # swap current pane with the next one
bind < swap-pane -U       # swap current pane with the previous one

# maximize current pane
bind + run 'cut -c3- ~/.tmux.conf | sh -s _maximize_pane "#{session_name}" #D'

# pane resizing
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# window navigation
unbind n
unbind p
bind -r C-j previous-window # select previous window
bind -r C-k next-window     # select next window
bind Tab last-window        # move to last active window

# -- navigation ----------------------------------------------------------------

# Put status bar at the bottom
set-option -g status-position bottom
set-option -g status on
set-option -g status-interval 5

# Minimal global style
set-option -g status-style "bg=colour235,fg=colour245"

# Left side: session name
set-option -g status-left-length 30
set-option -g status-left " #[fg=colour250,bold]#S #[default]"

# Right side: prefix indicator, pane, date/time
set-option -g status-right-length 80
set-option -g status-right "#{?client_prefix,#[fg=colour235 bg=colour214 bold] PREFIX #[default],} #[fg=colour244]pane #[fg=colour250]#P #[fg=colour244]| #[fg=colour250]%H:%M #[fg=colour244]%d %b "

# Window list
setw -g window-status-format " #[fg=colour244]#I:#W "
setw -g window-status-current-format " #[fg=colour235,bg=colour39,bold] #I:#W #[default] "

# Separators
set-option -g status-justify left

# Pane border styling
set-option -g pane-border-style "fg=colour238"
set-option -g pane-active-border-style "fg=colour39"

# Message styling
set-option -g message-style "bg=colour39,fg=colour235,bold"
set-option -g mode-style "bg=colour39,fg=colour235,bold"
